name: Bug report
description: womm did something wrong
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: womm and Node.js versions
    validations:
      required: true
  - type: markdown
    attributes:
      value: Please remove anything private before pasting a snapshot.
