id: node-below-14-optional-chaining
title: No optional chaining before Node.js 14
why: Node.js 14 enabled optional chaining by default, so older versions report a syntax error on ?.
fix: Upgrade Node.js, or transpile the code.
source: https://nodejs.org/en/blog/release/v14.0.0
when:
  - finding: node
    range: <14
